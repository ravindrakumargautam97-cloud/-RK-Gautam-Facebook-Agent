
name: Safe Facebook Post Recovery

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID (leave empty for all pending posts)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  recovery-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      DRY_RUN: 'true'
      POST_ID: ${{ inputs.post_id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Packages
        run: python -m pip install requests

      - name: Check Recovery Script
        run: python -m py_compile recover_post.py

      - name: Generate Recovery Report
        run: |
          if [ -n "$POST_ID" ]; then
            python recover_post.py --post-id "$POST_ID"
          else
            python recover_post.py
          fi
