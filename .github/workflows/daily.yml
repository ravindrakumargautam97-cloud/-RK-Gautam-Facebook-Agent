
name: RK Gautam Daily AI Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

jobs:
  daily-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tools
        run: |
          python -m pip install Pillow edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Generate Photos and Reels
        run: python agent.py

      - name: Save Generated Content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-gautam-photos-reels
          path: output/
          retention-days: 7
          if-no-files-found: warn
