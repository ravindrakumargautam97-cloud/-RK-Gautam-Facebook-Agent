
name: RK Gautam Daily AI Agent

on:
  workflow_dispatch:
    inputs:
      post_slot:
        description: "Select posting time (IST)"
        required: true
        type: choice
        default: "08:00"
        options:
          - "08:00"
          - "09:40"
          - "10:00"
          - "12:00"
          - "14:00"
          - "16:00"
          - "18:00"
          - "19:30"
          - "21:00"

permissions:
  contents: write

concurrency:
  group: rk-gautam-facebook-agent
  cancel-in-progress: false

jobs:
  daily-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow edge-tts requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Determine Posting Slot
        id: slot
        env:
          POST_SLOT_INPUT: ${{ inputs.post_slot }}
        run: |
          python - <<'PY'
          import os

          slot = os.environ.get("POST_SLOT_INPUT", "")

          valid_slots = {
              "08:00",
              "09:40",
              "10:00",
              "12:00",
              "14:00",
              "16:00",
              "18:00",
              "19:30",
              "21:00",
          }

          if slot not in valid_slots:
              raise RuntimeError(
                  f"Invalid posting slot: {slot}"
              )

          print("Selected IST slot:", slot)

          with open(
              os.environ["GITHUB_OUTPUT"], "a"
          ) as output:
              output.write(f"slot={slot}\n")
          PY

      - name: Check Asset Files
        run: |
          ls -lh assets/backgrounds/
          ls -lh assets/music/

      - name: Generate Photos and Reels
        run: python agent.py

      - name: Verify Generated Files
        run: |
          python - <<'PY'
          from pathlib import Path

          for i in range(1, 5):
              for filename in (
                  f"post_{i}.png",
                  f"reel_{i}.mp4",
                  f"caption_{i}.txt",
              ):
                  path = Path("output") / filename

                  if not path.is_file():
                      raise FileNotFoundError(path)

                  if path.stat().st_size == 0:
                      raise RuntimeError(
                          f"Empty file: {path}"
                      )

                  print("Ready:", path)
          PY

      - name: Publish Scheduled Item
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          DRY_RUN: 'false'
        run: python daily_post.py

      - name: Save Generated Content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-gautam-content-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
