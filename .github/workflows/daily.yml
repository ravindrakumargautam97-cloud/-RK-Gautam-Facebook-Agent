
name: RK Gautam Daily AI Agent

on:
  workflow_dispatch:
  schedule:
    # Daily 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'

permissions:
  contents: read

jobs:
  daily-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tools
        run: |
          python -m pip install Pillow edge-tts requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Check Asset Files
        run: |
          echo "Checking background images"
          ls -lh assets/backgrounds/

          echo "Checking music files"
          ls -lh assets/music/

      - name: Generate Photos and Reels
        run: python agent.py

      - name: Test Facebook Posting Setup
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python -c "import os; assert os.getenv('FACEBOOK_PAGE_ID'), 'Page ID missing'; assert os.getenv('FACEBOOK_PAGE_ACCESS_TOKEN'), 'Token missing'; print('Facebook configuration found')"

      - name: Post One Test Photo to Facebook
        if: github.event_name == 'workflow_dispatch'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          page_id = os.environ["FACEBOOK_PAGE_ID"]
          token = os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"]
          photo_path = "output/post_1.png"

          with open(photo_path, "rb") as photo:
              response = requests.post(
                  f"https://graph.facebook.com/v27.0/{page_id}/photos",
                  data={
                      "access_token": token,
                      "caption": "RK Gautam AI Agent - First Test Photo",
                      "published": "true"
                  },
                  files={"source": photo},
                  timeout=120
              )

          result = response.json()

          if not response.ok:
              raise RuntimeError(
                  "Facebook API error: "
                  + result.get("error", {}).get(
                      "message", "Unknown error"
                  )
              )

          print("Facebook test photo uploaded successfully")
          print("Photo ID:", result.get("id"))
          PY

      - name: Save Generated Content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-gautam-photos-reels
          path: output/
          retention-days: 7
          if-no-files-found: warn
