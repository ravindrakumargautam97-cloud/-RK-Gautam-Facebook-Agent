
name: RK Gautam Daily AI Agent

on:
  workflow_dispatch:
    inputs:
      test_one_reel:
        description: "Publish exactly ONE Reel to Facebook?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    # Daily 8:00 AM IST = 02:30 UTC
    - cron: '30 2 * * *'

permissions:
  contents: read

concurrency:
  group: rk-gautam-facebook-publishing
  cancel-in-progress: false

jobs:
  daily-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # STEP 1 - Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 2 - Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # STEP 3 - Install Tools
      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow edge-tts requests

          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

          ffmpeg -version

      # STEP 4 - Check Assets
      - name: Check Asset Files
        run: |
          echo "Checking background images"
          ls -lh assets/backgrounds/

          echo "Checking music files"
          ls -lh assets/music/

      # STEP 5 - Generate Content
      - name: Generate Photos and Reels
        run: python agent.py

      # STEP 6 - Verify All Generated Files
      - name: Verify Generated Files
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path("output")

          for i in range(1, 5):
              files = [
                  output / f"post_{i}.png",
                  output / f"reel_{i}.mp4",
                  output / f"caption_{i}.txt",
              ]

              for file in files:
                  if not file.is_file():
                      raise FileNotFoundError(
                          f"Missing file: {file}"
                      )

                  if file.stat().st_size == 0:
                      raise RuntimeError(
                          f"Empty file: {file}"
                      )

                  print("Ready:", file)

          print("All 4 photos and 4 reels ready!")
          PY

      # STEP 7 - Check Facebook Credentials
      - name: Check Facebook Configuration
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os

          assert os.getenv("FACEBOOK_PAGE_ID"), \
              "Facebook Page ID missing"

          assert os.getenv("FACEBOOK_PAGE_ACCESS_TOKEN"), \
              "Facebook Page Token missing"

          print("Facebook credentials configured")
          PY

      # STEP 8 - Safe Dry Run
      # No public Facebook posts are created here
      - name: Test All Photos and Reels
        env:
          DRY_RUN: "true"
        run: python facebook_post.py

      # STEP 9 - Publish ONLY ONE Reel
      # Runs only when manually selected
      - name: Publish One Test Reel
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.test_one_reel == 'true'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          DRY_RUN: "false"
          CONFIRM_ONE_REEL: "YES"
        run: python test_one_reel.py

      # STEP 10 - Save Generated Content
      - name: Save Generated Content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-gautam-photos-reels
          path: output/
          retention-days: 7
          if-no-files-found: warn
