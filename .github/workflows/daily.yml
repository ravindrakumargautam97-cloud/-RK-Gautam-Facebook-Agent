
name: RK Gautam Daily AI Agent

on:
  workflow_dispatch:
    inputs:
      post_slot:
        description: "Select posting time (IST)"
        required: true
        type: choice
        default: "08:00"
        options:
          - "08:00"
          - "10:00"
          - "12:00"
          - "14:00"
          - "16:00"
          - "18:00"
          - "19:30"
          - "21:00"

  schedule:
    - cron: '30 2 * * *'
    - cron: '30 4 * * *'
    - cron: '30 6 * * *'
    - cron: '30 8 * * *'
    - cron: '30 10 * * *'
    - cron: '30 12 * * *'
    - cron: '0 14 * * *'
    - cron: '30 15 * * *'

permissions:
  contents: write

concurrency:
  group: rk-gautam-facebook-agent
  cancel-in-progress: false

jobs:
  daily-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AUTO_PUBLISH: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow edge-tts requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Determine Posting Slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.post_slot }}
        run: |
          python - <<'PY'
          import os

          cron_slots = {
              "30 2 * * *": "08:00",
              "30 4 * * *": "10:00",
              "30 6 * * *": "12:00",
              "30 8 * * *": "14:00",
              "30 10 * * *": "16:00",
              "30 12 * * *": "18:00",
              "0 14 * * *": "19:30",
              "30 15 * * *": "21:00",
          }

          if os.environ["EVENT_NAME"] == "schedule":
              slot = cron_slots.get(
                  os.environ.get("CRON_EXPRESSION", "")
              )
          else:
              slot = os.environ.get("MANUAL_SLOT")

          if slot not in cron_slots.values():
              raise RuntimeError("Invalid posting slot")

          with open(
              os.environ["GITHUB_OUTPUT"], "a"
          ) as output:
              output.write(f"slot={slot}\n")

          print("Selected IST slot:", slot)
          PY

      - name: Load Posting History
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import requests

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/repos/{repo}"
              "/contents/posting_history.json"
          )

          response = requests.get(
              url,
              params={"ref": "facebook-posting-history"},
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github.raw+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              timeout=30,
          )

          response.raise_for_status()

          history = response.json()

          if not isinstance(history, dict):
              raise RuntimeError(
                  "Posting history must be a JSON object"
              )

          Path("posting_history.json").write_text(
              json.dumps(
                  history,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print("Posting history loaded successfully")
          print("History records:", len(history))
          PY

      - name: Check Asset Files
        run: |
          ls -lh assets/backgrounds/
          ls -lh assets/music/

      - name: Generate Photos and Reels
        run: python agent.py

      - name: Verify Generated Files
        run: |
          python - <<'PY'
          from pathlib import Path

          for i in range(1, 5):
              for name in (
                  f"post_{i}.png",
                  f"reel_{i}.mp4",
                  f"caption_{i}.txt",
              ):
                  path = Path("output") / name

                  if not path.is_file():
                      raise FileNotFoundError(path)

                  if path.stat().st_size == 0:
                      raise RuntimeError(
                          f"Empty file: {path}"
                      )

                  print("Ready:", path)
          PY

      - name: Publish Scheduled Item
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          DRY_RUN: "true"
        run: python daily_post.py

      - name: Save Generated Content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-gautam-content-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
