
name: RK Gautam Daily AI Agent

on:
  workflow_dispatch:
    inputs:
      post_slot:
        description: "Select posting time (IST)"
        required: true
        type: choice
        default: "08:00"
        options:
          - "08:00"
          - "09:40"
          - "10:00"
          - "12:00"
          - "14:00"
          - "16:00"
          - "18:00"
          - "19:30"
          - "21:00"

  schedule:
    # UTC times converted from IST
    - cron: '30 2 * * *'   # 08:00 IST
    - cron: '30 4 * * *'   # 10:00 IST
    - cron: '30 6 * * *'   # 12:00 IST
    - cron: '30 8 * * *'   # 14:00 IST
    - cron: '30 10 * * *'  # 16:00 IST
    - cron: '30 12 * * *'  # 18:00 IST
    - cron: '0 14 * * *'   # 19:30 IST
    - cron: '30 15 * * *'  # 21:00 IST

permissions:
  contents: write

concurrency:
  group: rk-gautam-facebook-agent
  cancel-in-progress: false

jobs:
  daily-content:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow edge-tts requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Determine Posting Slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.post_slot }}
        run: |
          python - <<'PY'
          import os

          cron_slots = {
              "30 2 * * *": "08:00",
              "30 4 * * *": "10:00",
              "30 6 * * *": "12:00",
              "30 8 * * *": "14:00",
              "30 10 * * *": "16:00",
              "30 12 * * *": "18:00",
              "0 14 * * *": "19:30",
              "30 15 * * *": "21:00",
          }

          event_name = os.environ.get("EVENT_NAME", "")
          cron_expression = os.environ.get(
              "CRON_EXPRESSION", ""
          )
          manual_slot = os.environ.get("MANUAL_SLOT", "")

          print("Event:", event_name)
          print("Schedule:", cron_expression)
          print("Manual input:", manual_slot)

          if event_name == "schedule":
              slot = cron_slots.get(cron_expression)

          elif event_name == "workflow_dispatch":
              slot = manual_slot

          else:
              raise RuntimeError(
                  f"Unsupported event: {event_name}"
              )

          if not slot:
              raise RuntimeError(
                  f"Unable to determine slot for {event_name}"
              )

          valid_slots = set(cron_slots.values()) | {"09:40"}

          if slot not in valid_slots:
              raise RuntimeError(
                  f"Invalid posting slot: {slot}"
              )

          print("Selected IST slot:", slot)

          with open(
              os.environ["GITHUB_OUTPUT"], "a"
          ) as output:
              output.write(f"slot={slot}\n")
          PY

      - name: Check Asset Files
        run: |
          ls -lh assets/backgrounds/
          ls -lh assets/music/

      - name: Generate Photos and Reels
        run: python agent.py

      - name: Verify Generated Files
        run: |
          python - <<'PY'
          from pathlib import Path

          for i in range(1, 5):
              for filename in (
                  f"post_{i}.png",
                  f"reel_{i}.mp4",
                  f"caption_{i}.txt",
              ):
                  path = Path("output") / filename

                  if not path.is_file():
                      raise FileNotFoundError(path)

                  if path.stat().st_size == 0:
                      raise RuntimeError(
                          f"Empty file: {path}"
                      )

                  print("Ready:", path)
          PY

      - name: Publish Scheduled Item
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          DRY_RUN: 'false'
        run: python daily_post.py

      - name: Save Generated Content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-gautam-content-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
