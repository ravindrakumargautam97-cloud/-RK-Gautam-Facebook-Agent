
name: Test Automatic Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

jobs:
  test-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Check Automatic Trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Automatic Schedule Test"
          echo "Trigger: $EVENT_NAME"
          TZ=Asia/Kolkata date
          echo "Schedule test successful"
