name: Test Permanent Content History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-content-history
  cancel-in-progress: false

jobs:
  test-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Requests
        run: python -m pip install requests

      - name: Test Permanent Duplicate Protection
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python test_content_history.py
